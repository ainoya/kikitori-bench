      <line x1="66" y1="368.0" x2="906" y2="368.0"></line>
      <line x1="66" y1="284.5" x2="906" y2="284.5"></line>
      <line x1="66" y1="201.0" x2="906" y2="201.0"></line>
      <line x1="66" y1="117.5" x2="906" y2="117.5"></line>
      <line x1="66" y1="34.0" x2="906" y2="34.0"></line>
    </g>
    <g class="axis">
      <text x="66.0" y="388" text-anchor="middle">0.00x</text>
      <text x="276.0" y="388" text-anchor="middle">0.05x</text>
      <text x="486.0" y="388" text-anchor="middle">0.10x</text>
      <text x="696.0" y="388" text-anchor="middle">0.15x</text>
      <text x="906.0" y="388" text-anchor="middle">0.20x</text>
      <text x="54" y="372.0" text-anchor="end">0%</text>
      <text x="54" y="288.5" text-anchor="end">25%</text>
      <text x="54" y="205.0" text-anchor="end">50%</text>
      <text x="54" y="121.5" text-anchor="end">75%</text>
      <text x="54" y="38.0" text-anchor="end">100%</text>
      <text class="axis-title" x="486.0" y="414" text-anchor="middle">RTF - processing time ÷ audio length (lower is faster)</text>
      <text class="axis-title" transform="translate(16 201.0) rotate(-90)" text-anchor="middle">Overall score</text>
    </g>
    <path class="frontier" d="M99.6,143.9 L204.6,143.9 L204.6,128.5 L376.8,128.5 L376.8,117.2"></path>
