  <g class="mark on"><circle class="dot" cx="71" cy="441" r="5"/></g><text class="legend-text" x="83" y="445">On the Pareto frontier</text>
  <g class="mark off"><circle class="dot" cx="255.2" cy="441" r="5"/></g><text class="legend-text" x="267.2" y="445">Dominated</text>
</g>
  <text class="chart-footnote" x="20" y="527">2026-09-10 · github.com/ainoya/kikitori-bench @ 6668291</text>
