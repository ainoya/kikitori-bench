        <text class="point-label" x="216.0" y="98.5" text-anchor="middle">Gemini 3.8 Flash (no thinking)</text>
      </g>
      <g class="mark off" tabindex="0">
        <title>Gemini 3.5 Transcribe
Score: 66.3%
Cost: $0.3016 (est.) / audio hour  ·  run: $0.9324
Latency: 2265 ms | RTF: 0.03x</title>
        <circle class="hit" cx="548.6" cy="146.6" r="18"></circle>
        <circle class="dot" cx="548.6" cy="146.6" r="7"></circle>
        <text class="point-label" x="548.6" y="168.6" text-anchor="middle">Gemini 3.5 Transcribe</text>
      </g>
      <g class="mark off" tabindex="0">
        <title>Meta Muse Voice Transcribe
Score: 66.2%
Cost: $0.1800 / audio hour  ·  run: $0.5564
Latency: 14178 ms | RTF: 0.15x</title>
        <circle class="hit" cx="354.0" cy="146.9" r="18"></circle>
        <circle class="dot" cx="354.0" cy="146.9" r="7"></circle>
        <text class="point-label" x="354.0" y="168.9" text-anchor="middle">Meta Muse Voice Transcribe</text>
      </g>
      <g class="mark off" tabindex="0">
        <title>Groq Whisper large-v3
Score: 63.9%
