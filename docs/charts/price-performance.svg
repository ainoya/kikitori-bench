        <title>Gemini 3.8 Flash
Score: 75.1%
Cost: $0.2625 / audio hour  ·  run: $0.8115
Latency: 6766 ms | RTF: 0.07x</title>
        <circle class="hit" cx="486.0" cy="117.2" r="18"></circle>
        <circle class="dot" cx="486.0" cy="117.2" r="7"></circle>
        <text class="point-label" x="486.0" y="87.2" text-anchor="middle">Gemini 3.8 Flash</text>
      </g>
      <g class="mark on" tabindex="0">
