      <text x="366.0" y="388" text-anchor="middle">$0.10</text>
      <text x="666.0" y="388" text-anchor="middle">$0.20</text>
      <text x="966.0" y="388" text-anchor="middle">$0.30</text>
      <text x="1266.0" y="388" text-anchor="middle">$0.40</text>
