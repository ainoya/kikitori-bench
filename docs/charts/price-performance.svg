Latency: 2173 ms | RTF: 0.03x</title>
        <circle class="hit" cx="244.1" cy="154.6" r="18"></circle>
        <circle class="dot" cx="244.1" cy="154.6" r="7"></circle>
        <text class="point-label" x="244.1" y="192.6" text-anchor="middle">Groq Whisper large-v3</text>
